databases:
  - name: autocare-db
    plan: free
    region: singapore
    databaseName: autocare_ai

services:
  - type: web
    name: autocare-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: autocare-db
          property: connectionString

      - key: FLASK_ENV
        value: production