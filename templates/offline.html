<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; background: radial-gradient(circle at center, #1e293b, #020617); text-align: center; }
        .offline-card { padding: 50px; border-radius: 20px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
        .offline-icon { font-size: 5rem; color: #94a3b8; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon"><i class="bi bi-wifi-off"></i></div>
        <h2 class="fw-bold mb-3">You're Offline</h2>
        <p class="text-secondary mb-4">Please check your internet connection and try again.</p>
        <button onclick="window.location.reload()" class="btn btn-primary px-4 py-2 rounded-pill"><i class="bi bi-arrow-clockwise me-2"></i>Retry</button>
    </div>
</body>
</html>
