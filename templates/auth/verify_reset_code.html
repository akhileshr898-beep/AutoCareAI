<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="/" class="text-decoration-none d-block mb-2 text-muted small"><i class="bi bi-arrow-left"></i> Back to Home</a><div class="auth-logo">🚗</div>
                <h2 class="fw-bold">Verify Your Email</h2>
                <p class="text-muted">Enter the 6-digit verification code sent to your email.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.verify_reset_code') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label class="form-label">Verification Code</label>
                    <input type="text" name="code" class="form-control form-control-lg text-center fw-bold" placeholder="• • • • • •" minlength="6" maxlength="6" pattern="\d{6}" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Verify Code</button>
            </form>

            <p class="text-center mt-4 mb-0">
                <a href="{{ url_for('auth.resend_reset_code') }}" class="fw-semibold text-decoration-none">Resend Code</a>
            </p>
        </div>
    </div>
</body>
</html>
