<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Too Large | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; background: radial-gradient(circle at center, #2d1c3d, #07040a); text-align: center; }
        .error-card { padding: 40px; border-radius: 20px; background: rgba(30, 12, 47, 0.8); border: 1px solid rgba(168, 85, 247, 0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.4); max-width: 500px; }
        .error-code { font-size: 6rem; font-weight: 800; color: #a855f7; line-height: 1; margin-bottom: 20px; text-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">413</div>
        <h2 class="fw-bold mb-3">File Too Large</h2>
        <p class="text-light mb-4 opacity-75">The uploaded file exceeds the 20MB limit. Please choose a smaller file.</p>
        <button onclick="window.history.back()" class="btn btn-primary px-4 py-2 rounded-pill"><i class="bi bi-arrow-left me-2"></i>Go Back</button>
    </div>
</body>
</html>
