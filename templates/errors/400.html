<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Request | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; background: radial-gradient(circle at center, #3d2b1c, #0a0804); text-align: center; }
        .error-card { padding: 40px; border-radius: 20px; background: rgba(47, 30, 12, 0.8); border: 1px solid rgba(245, 158, 11, 0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.4); max-width: 500px; }
        .error-code { font-size: 6rem; font-weight: 800; color: #f59e0b; line-height: 1; margin-bottom: 20px; text-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">400</div>
        <h2 class="fw-bold mb-3">Bad Request</h2>
        <p class="text-light mb-4 opacity-75">Your request could not be processed, or the security token expired. Please try again.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-warning px-4 py-2 rounded-pill"><i class="bi bi-arrow-clockwise me-2"></i>Back to Login</a>
    </div>
</body>
</html>
