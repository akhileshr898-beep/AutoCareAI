<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; background: radial-gradient(circle at center, #3d1c1c, #0a0404); text-align: center; }
        .error-card { padding: 40px; border-radius: 20px; background: rgba(47, 12, 12, 0.8); border: 1px solid rgba(239, 68, 68, 0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .error-code { font-size: 6rem; font-weight: 800; color: #ef4444; line-height: 1; margin-bottom: 20px; text-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">500</div>
        <h2 class="fw-bold mb-3">Internal Server Error</h2>
        <p class="text-light mb-4 opacity-75">Something went wrong on our end. We're looking into it.</p>
        <a href="{{ url_for('index') }}" class="btn btn-danger px-4 py-2 rounded-pill"><i class="bi bi-arrow-clockwise me-2"></i>Try Again</a>
    </div>
</body>
</html>
