<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; background: radial-gradient(circle at center, #12315d, #040b14); text-align: center; }
        .error-card { padding: 40px; border-radius: 20px; background: rgba(12, 27, 47, 0.8); border: 1px solid rgba(148, 163, 184, 0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .error-code { font-size: 6rem; font-weight: 800; color: #38bdf8; line-height: 1; margin-bottom: 20px; text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h2 class="fw-bold mb-3">Page Not Found</h2>
        <p class="text-secondary mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2 rounded-pill"><i class="bi bi-house me-2"></i>Return Home</a>
    </div>
</body>
</html>
