<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Digital Twin | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/garage/garage.css') }}">
</head>
<body>
    <div class="garage-background"></div>
    <nav class="garage-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="{{ url_for('dashboard.dashboard') }}" class="garage-brand"><span class="brand-icon"><i class="bi bi-car-front-fill"></i></span> AutoCare AI</a>
            <a href="{{ url_for('garage.garage', vehicle_id=vehicle.id) }}" class="btn btn-outline-light">Back to Garage</a>
        </div>
    </nav>
    <main class="container py-5">
        <div class="vehicle-viewer-card w-100 mx-auto" style="max-width: 800px; padding: 2rem;">
            <h2 class="text-white text-center mb-4">Digital Twin Visualization</h2>
            
            <div class="viewer-grid"></div>
            <div class="scanner-line"></div>
            
            <div class="vehicle-display text-center">
                {% if vehicle.vehicle_image %}
                <img src="{{ url_for('static', filename='uploads/' + vehicle.vehicle_image) }}" alt="{{ vehicle.vehicle_name }}" id="vehicleImage" class="img-fluid rounded">
                {% else %}
                <div class="vehicle-placeholder mx-auto" style="font-size: 5rem; color: #38bdf8;">
                    <i class="bi bi-car-front-fill"></i>
                </div>
                {% endif %}
            </div>
            
            <div class="digital-twin-hotspots text-center mt-5">
                <!-- Visual mock for the twin -->
                <p class="text-info">Component analysis active. Vehicle health is currently monitored.</p>
                <div class="d-flex justify-content-center gap-3">
                    <span class="badge bg-success p-2">Engine: Optimal</span>
                    <span class="badge bg-info p-2">Battery: Good</span>
                    <span class="badge bg-warning p-2">Tires: Monitor</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
