<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Service | AutoCare AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { min-height: 100vh; color: white; background: radial-gradient(circle at top left, #12315d, transparent 35%), linear-gradient(135deg, #040b14, #071728); }
        .form-card { max-width: 820px; margin: auto; padding: 35px; border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 26px; background: rgba(12, 27, 47, 0.88); }
        .form-control, .form-select, .input-group-text { background: rgba(255,255,255,0.05); color: white; border-color: rgba(148,163,184,0.2); }
        .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.07); color: white; border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,0.12); }
        option { background: #071728; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('dashboard.dashboard') }}">🚗 AutoCare AI</a>
            <a href="{{ url_for('service.service_history', vehicle_id=vehicle.id) }}" class="btn btn-outline-light">Service History</a>
        </div>
    </nav>
    <main class="container py-5">
        <div class="form-card">
            <div class="mb-4">
                <span class="text-info fw-semibold">MAINTENANCE</span>
                <h1 class="fw-bold mt-2">Add Service Record</h1>
                <p class="text-secondary">{{ vehicle.vehicle_name }} ({{ vehicle.registration_number }})</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST" id="serviceForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Service Date *</label>
                        <input type="date" name="service_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Odometer *</label>
                        <div class="input-group">
                            <input type="number" name="odometer" class="form-control" min="0" value="{{ vehicle.odometer }}" required>
                            <span class="input-group-text">km</span>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Service Type *</label>
                        <select name="service_type" class="form-select" required>
                            <option value="General Service">General Service</option>
                            <option value="Repair">Repair</option>
                            <option value="Inspection">Inspection</option>
                            <option value="Body Work">Body Work</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Service Center</label>
                        <input type="text" name="service_center" class="form-control" placeholder="e.g. Authorized Dealer">
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label">Total Cost *</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" name="total_cost" class="form-control" min="0" step="0.01" required>
                        </div>
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label">Work Done & Notes</label>
                        <textarea name="work_done" class="form-control" rows="4" placeholder="Describe the maintenance performed..."></textarea>
                    </div>
                    
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold">
                            <i class="bi bi-tools me-2"></i> Save Service Record
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
